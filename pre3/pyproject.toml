[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pre3"
version = "0.1.0"
description = "Pre³: Enabling Deterministic Pushdown Automata for Faster Structured LLM Generation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]
torch = ["torch>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "."]
